apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    service: {{ .Values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      service: {{ .Values.name }}
  template:
    metadata:
      labels:
        service: {{ .Values.name }}
    spec:
      containers:
        - name: app
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          workingDir: {{ .Values.workingDir | quote }}
          command: ["sh", "-c", "sleep infinity"]
          ports:
            - containerPort: {{ .Values.port }}
              name: http
