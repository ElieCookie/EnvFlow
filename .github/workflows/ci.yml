name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Verify CLI loads
        run: node bin/lenv.js help
      - name: Doctor in empty dir exits 1
        run: |
          cd "$(mktemp -d)"
          if node "$GITHUB_WORKSPACE/bin/lenv.js" doctor; then
            echo "expected exit 1"; exit 1
          fi
      - name: Doctor with config passes
        run: |
          cd "$(mktemp -d)"
          cat > lenv.config.yaml <<'EOF'
          tools:
            - name: git
          EOF
          node "$GITHUB_WORKSPACE/bin/lenv.js" doctor
